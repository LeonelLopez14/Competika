# =====================================================================
# COMPETIKA — VirtualHost para XAMPP / LAMPP (PC de desarrollo)
#
# 1. Copiar el proyecto en htdocs (o ajustar la ruta de abajo):
#      Linux  (LAMPP):  /opt/lampp/htdocs/Competika
#      Windows (XAMPP): C:/xampp/htdocs/Competika
# 2. Pegar este bloque al final de:
#      Linux:   /opt/lampp/etc/extra/httpd-vhosts.conf
#      Windows: C:\xampp\apache\conf\extra\httpd-vhosts.conf
#    y verificar que en httpd.conf esté descomentado:
#      Include etc/extra/httpd-vhosts.conf        (Windows: conf/extra/...)
#      LoadModule rewrite_module modules/mod_rewrite.so
#      LoadModule headers_module modules/mod_headers.so
# 3. Agregar al archivo hosts:  127.0.0.1  competika.local
#      Linux:   /etc/hosts      Windows: C:\Windows\System32\drivers\etc\hosts
# 4. Reiniciar Apache y entrar a http://competika.local
#
# El primer VirtualHost mantiene http://localhost funcionando como antes
# (phpMyAdmin, otros proyectos).
# =====================================================================

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "/opt/lampp/htdocs"
</VirtualHost>

<VirtualHost *:80>
    ServerName competika.local
    DocumentRoot "/opt/lampp/htdocs/Competika"
    # Windows: DocumentRoot "C:/xampp/htdocs/Competika"

    SetEnv APP_ENV development

    <Directory "/opt/lampp/htdocs/Competika">
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/opt/lampp/htdocs/Competika/(config|core|model|repository|service|database|apache|docker|\.git)(/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  "logs/competika-error.log"
    CustomLog "logs/competika-access.log" common
</VirtualHost>
