# =====================================================================
# COMPETIKA — VirtualHost de Apache para el servidor (Linux / VM de Proxmox)
#
# Instalación (Debian/Ubuntu):
#   sudo cp apache/competika.conf /etc/apache2/sites-available/competika.conf
#   sudo a2enmod rewrite headers ssl
#   sudo a2ensite competika && sudo a2dissite 000-default
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Cambiar: ServerName, la ruta /var/www/competika y los certificados.
# Las reglas de rutas y de bloqueo de carpetas están en el .htaccess del
# proyecto (AllowOverride All); acá se repiten las críticas para que el
# servidor siga protegido aunque alguien borre el .htaccess.
# XAMPP/LAMPP en una PC de desarrollo: ver apache/competika-xampp.conf
# =====================================================================

# --- HTTP: solo redirige a HTTPS -------------------------------------
<VirtualHost *:80>
    ServerName competika.local
    ServerAlias www.competika.local

    # Si el certificado TLS lo maneja un proxy delante (por ejemplo el
    # reverse proxy de Proxmox o Nginx Proxy Manager), comentar el Redirect
    # y usar la configuración del bloque :443 acá mismo.
    Redirect permanent / https://competika.local/
</VirtualHost>

# --- HTTPS -------------------------------------------------------------
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName competika.local
    ServerAlias www.competika.local
    DocumentRoot /var/www/competika

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/competika.crt
    SSLCertificateKeyFile /etc/ssl/private/competika.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # Variables que lee config/database.php (no dejar la clave en el repositorio)
    SetEnv APP_ENV production
    SetEnv DB_HOST localhost
    SetEnv DB_NAME competika_db
    SetEnv DB_USER competika_app
    # SetEnv DB_PASS una_clave_larga   <- mejor en un archivo aparte con chmod 640

    <Directory /var/www/competika>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Carpetas internas: nunca se sirven por HTTP (solo las incluye PHP)
    <DirectoryMatch "^/var/www/competika/(config|core|model|repository|service|database|apache|docker|\.git)(/|$)">
        Require all denied
    </DirectoryMatch>

    # En uploads/ solo se sirven imágenes: nada de PHP ni scripts
    <Directory /var/www/competika/uploads>
        Options -Indexes -ExecCGI
        <FilesMatch "\.(?i:php\d?|phtml|phar|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_php.c>
            php_admin_flag engine off
        </IfModule>
    </Directory>

    # Cabeceras de seguridad
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Header always unset X-Powered-By
    </IfModule>

    # Sin método TRACE y sin pedidos gigantes (la foto de perfil es de 5 MB como máximo)
    TraceEnable Off
    LimitRequestBody 8388608

    # PHP (si se usa mod_php; con PHP-FPM van en el pool o en php.ini)
    <IfModule mod_php.c>
        php_admin_value upload_max_filesize 5M
        php_admin_value post_max_size 8M
        php_admin_flag  display_errors off
        php_admin_flag  session.cookie_httponly on
        php_admin_value session.cookie_samesite Lax
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/competika_error.log
    CustomLog ${APACHE_LOG_DIR}/competika_access.log combined
</VirtualHost>
</IfModule>

# Además, en /etc/apache2/conf-available/security.conf (configuración global):
#   ServerTokens Prod
#   ServerSignature Off
