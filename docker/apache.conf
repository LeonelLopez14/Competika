# VirtualHost de Competika en el contenedor (HTTP; el HTTPS lo pone el proxy).
<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerSignature Off
    TraceEnable Off
    LimitRequestBody 8388608

    <Directory /var/www/html>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/html/(config|core|model|repository|service|database|apache|docker|\.git)(/|$)">
        Require all denied
    </DirectoryMatch>

    <Directory /var/www/html/uploads>
        <FilesMatch "\.(?i:php\d?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <IfModule mod_headers.c>
        Header always unset X-Powered-By
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
