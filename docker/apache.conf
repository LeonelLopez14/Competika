# VirtualHost de Competika para el contenedor Docker (y base para un servidor Linux).
# Las reglas de seguridad y de rutas viven en el .htaccess del proyecto, por eso
# AllowOverride All. FollowSymLinks es necesario para que mod_rewrite funcione.
<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerSignature Off

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
